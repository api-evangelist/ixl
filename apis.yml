description: >-
  IXL Learning is a K-12 personalized practice platform with 17,000+ skills across Math,
  Language Arts, Science, Social Studies, and Spanish, plus the IXL Real-Time Diagnostic
  and skill recommendations. IXL is sold primarily as a SaaS subscription to families,
  teachers, schools, and districts. Its integration surface is school-rostering and SSO,
  not a public developer API: IXL supports Clever (SSO + rostering), ClassLink (SSO +
  OneRoster auto-rostering), OneRoster CSV/REST, LTI, Google Classroom, and SAML SSO for
  district deployments. There is no public REST API portal, no published OpenAPI, and no
  partner developer program.
